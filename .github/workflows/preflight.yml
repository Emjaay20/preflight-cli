name: preflight

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.75.0
      - name: test
        run: cargo test
      - name: review clean fixture
        run: cargo run --quiet -- review fixtures/harbor-node/clean-relay --claims fixtures/harbor-node/claims.json --out reviews/clean
      - name: extra-host must block
        run: |
          set +e
          cargo run --quiet -- review fixtures/harbor-node/extra-host --claims fixtures/harbor-node/claims.json --out reviews/extra-host
          code=$?
          set -e
          test "$code" -eq 2
      - name: post REVIEW.md
        if: always()
        run: |
          {
            echo "## Preflight"
            echo
            cat reviews/clean/REVIEW.md
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: REVIEW
          path: reviews/*/REVIEW.md

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - run: npm run build -w @preflight/domain
      - run: npm test

  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rust, node]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.platform
          target: api
          push: true
          tags: |
            ghcr.io/emjaay20/preflight-platform:latest
            ghcr.io/emjaay20/preflight-platform:${{ github.sha }}
